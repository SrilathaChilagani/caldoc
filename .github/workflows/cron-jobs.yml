name: Cron jobs

# Vercel Hobby crons are limited to once per day. This workflow provides
# the higher-frequency schedules that production needs. Vercel cron entries
# in vercel.json serve as daily fallbacks if GitHub Actions is delayed.
#
# Schedules:
#   - reminders / cleanup: every hour (30-min appointment window coverage)
#   - pharmacy / lab retry: every 4 hours (re-dispatch failed external orders)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  reminders:
    name: Send appointment reminders
    runs-on: ubuntu-latest
    steps:
      - name: Ping reminders endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /tmp/body -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://www.caldoc.in/api/cron/reminders)
          echo "reminders: HTTP $code"
          cat /tmp/body; echo
          test "$code" = "200"

  cleanup:
    name: Release abandoned booking slots
    runs-on: ubuntu-latest
    steps:
      - name: Ping cleanup endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /tmp/body -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://www.caldoc.in/api/cron/cleanup-abandoned-bookings)
          echo "cleanup: HTTP $code"
          cat /tmp/body; echo
          test "$code" = "200"

  retry-pharmacy:
    name: Retry failed pharmacy dispatches
    runs-on: ubuntu-latest
    steps:
      - name: Ping pharmacy retry endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          hour=$(date -u +%H)
          if [ $((10#$hour % 4)) -ne 0 ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Skipping — not a 4-hour boundary (hour=$hour)"
            exit 0
          fi
          code=$(curl -s -o /tmp/body -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://www.caldoc.in/api/cron/retry-pharmacy-dispatch)
          echo "retry-pharmacy: HTTP $code"
          cat /tmp/body; echo
          test "$code" = "200"

  retry-lab:
    name: Retry failed lab dispatches
    runs-on: ubuntu-latest
    steps:
      - name: Ping lab retry endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          hour=$(date -u +%H)
          if [ $((10#$hour % 4)) -ne 0 ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Skipping — not a 4-hour boundary (hour=$hour)"
            exit 0
          fi
          code=$(curl -s -o /tmp/body -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://www.caldoc.in/api/cron/retry-lab-dispatch)
          echo "retry-lab: HTTP $code"
          cat /tmp/body; echo
          test "$code" = "200"
